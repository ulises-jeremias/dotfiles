# ============================================================================
# Plugin Configuration
# ============================================================================
# Plugins are managed by `hyprpm` (installed alongside hyprland).
# Each plugin's config lives under its own `plugin { ... }` block.
# ============================================================================

# ----------------------------------------------------------------------------
# ScrollOverview — niri-style overview plugin
# https://github.com/yayuuu/hyprland-scroll-overview
# ----------------------------------------------------------------------------
# Tuned to match the scrolling (Niri-like) column layout and the existing
# decoration.shadow defaults. wallpaper = 0 uses the global wallpaper only,
# consistent with the single-wallpaper rice model.
plugin {
    scrolloverview {
        # How far the gesture must travel to reach the overview "max"
        gesture_distance = 300

        # Preferred overview scale [0.1 - 0.9]
        scale = 0.5

        # Pixel gap between visible workspaces in the overview
        workspace_gap = 100

        # Overview layout: vertical matches the scrolling column workflow
        layout = vertical

        # Wallpaper mode: 0 = global only (matches single-wallpaper rice)
        wallpaper = 0

        # Blur only the main overview wallpaper (not per-workspace wallpapers)
        blur = false

        # Shadow around each workspace card.
        # Falls back to decoration:shadow:* when subvalues are unset.
        shadow {
            enabled = false
            range = 12
            render_power = 2
            color = rgba(1a1a1a2e)
        }
    }
}

# ----------------------------------------------------------------------------
# ScrollOverview gestures
# ----------------------------------------------------------------------------
# 3-finger swipe up toggles the overview on touchpad devices.
scrolloverview-gesture = 3, up, overview
