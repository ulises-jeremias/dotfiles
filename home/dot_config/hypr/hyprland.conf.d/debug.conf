# ============================================================================
# Debug Configuration — HorneroOS
# ============================================================================
# Suppress non-fatal config error popups (e.g. a plugin option block for a
# plugin that is temporarily not loaded). Real errors are still logged by
# Hyprland; this only silences the on-screen error toast.
# Note: hyprland.conf also carries an inline `debug { }` block (overlay /
# damage settings). Hyprland merges duplicate categories, last value wins
# per key, so both blocks coexist.
# Docs: https://wiki.hyprland.org/Configuring/Variables/#debug
# ============================================================================

debug {
    suppress_errors = true
}
