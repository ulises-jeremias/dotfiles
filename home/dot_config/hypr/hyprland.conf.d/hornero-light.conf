# ============================================================================
# Hornero Light — Hyprland theme fragment (opt-in light variant)
# ============================================================================
#
# Curated from profiles/themes/hornero-light/theme.json (first-class light
# ramp: deep terracotta primary #B24827, fired-clay secondary #7C4A2C,
# sunset amber #96590A, paper border #D9C2A6 on morning paper #FAF1E3).
#
# To use: uncomment the `hornero-light.conf` source line in
# ../hyprland.conf. It is sourced after colors.conf, so its values take
# precedence as the later source. A future horneroctl appearance release may flip
# that line automatically alongside the GTK day/night policy.
# ============================================================================

general {
    col.active_border = rgba(b24827ee) rgba(96590aee) 45deg
    col.inactive_border = rgba(d9c2a6aa)
}

group {
    col.border_active = rgba(b24827ee)
    col.border_inactive = rgba(d9c2a6aa)
    col.border_locked_active = rgba(96590aee)
    col.border_locked_inactive = rgba(f1e3ceaa)

    groupbar {
        col.active = rgba(b24827ee)
        col.inactive = rgba(fffdf7ee)
        col.locked_active = rgba(96590aee)
        col.locked_inactive = rgba(f1e3ceee)
    }
}

decoration {
    shadow {
        color = rgba(2b1a1133)
    }
}
