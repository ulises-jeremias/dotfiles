# ============================================================================
# Colors Configuration — Hornero Dark factory default
# ============================================================================
#
# Curated from profiles/themes/hornero-dark/theme.json (flagship semantic
# tokens: ember terracotta primary #E07856, sunset amber accent #F2B749,
# clay border #6B4E3B, espresso surfaces #1D1410/#2B1F18/#3C2C21).
# Sophisticated, no neon rainbow: the active border is a terracotta→amber
# gradient, inactive chrome stays background-adjacent, and shadows are
# tinted with the tooltip scrim #0F0B08 (see decoration shadow in
# ../hyprland.conf).
#
# Apply-time contract: horneroctl may regenerate this file from the
# active scheme (`horneroctl appearance colors generate --yes`); a fresh
# boot with no generated scheme always lands on these Hornero Dark values.
# The light counterpart lives in hornero-light.conf (sourced by uncommenting
# its line in ../hyprland.conf, which then takes precedence as the later
# source).
# ============================================================================

# Border colors
# Format: col.active_border = rgba(RRGGBBaa) [rgba(RRGGBBaa) angle]
# Format: col.inactive_border = rgba(RRGGBBaa)

general {
    col.active_border = rgba(e07856ee) rgba(f2b749ee) 45deg
    col.inactive_border = rgba(6b4e3baa)
}

# Group border colors
group {
    col.border_active = rgba(e07856ee)
    col.border_inactive = rgba(6b4e3baa)
    col.border_locked_active = rgba(f2b749ee)
    col.border_locked_inactive = rgba(3c2c21aa)

    groupbar {
        col.active = rgba(e07856ee)
        col.inactive = rgba(2b1f18ee)
        col.locked_active = rgba(f2b749ee)
        col.locked_inactive = rgba(3c2c21ee)
    }
}
