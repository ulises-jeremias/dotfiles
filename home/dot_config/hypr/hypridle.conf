# Hypridle configuration
# Modular, minimal defaults. Adjust timeouts as needed.
# Referencia: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# Inactivity watcher modules

# Hornero Shell owns idle locking through Config.general.idle.timeouts.
# Keep hypridle focused on DPMS and suspend so two lockers never compete.
listener {
  timeout = 420            # 7 min
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  timeout = 1800           # 30 min
  on-timeout = systemctl suspend
  on-resume = notify-send "Wake" "System resumed from suspend"
}

