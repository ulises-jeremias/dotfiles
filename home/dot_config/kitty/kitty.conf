# Reload configuration live
allow_remote_control yes

# Default working directory
initial_window_width 80
initial_window_height 24
startup_working_directory ~/

# Default shell (uncomment if you want to use tmux as in Kitty)
# shell /bin/zsh
# shell_args --login -c "tmux attach -t '(∩Ȍ▾Ȍ)⊃━☆ﾟ,*' 2> /dev/null || tmux new -s '(∩Ȍ▾Ȍ)⊃━☆ﾟ,*'"

# Factory default palette: Hornero Dark (static, ships with the package).
# Switch to `include hornero-light.conf` for the light variant; see
# hornero-light.conf for the day/night note.
include hornero-dark.conf

# Smart colors (generated by `horneroctl appearance colors generate --yes`,
# absent on fresh boot). When present, these apply-time values override
# the factory palette above.
include ~/.cache/hornero/smart-colors/colors-kitty.conf

# Cursor settings
cursor_shape block
cursor_blink no

# Font settings
font_family Hack Nerd Font
bold_font Hack Nerd Font Bold
italic_font Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size 12.0

# Transparency
background_opacity 0.80

# Window behavior
dynamic_title yes
window_padding_width 15
window_padding_height 15

# Scrollback history
scrollback_lines 2500
scrollback_pager_history yes
scrollback_pager no
scrollback_multiplier 3.0

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+page_up scroll_line_up
map ctrl+shift+page_down scroll_line_down
map ctrl+shift+home scroll_to_top
map ctrl+shift+end scroll_to_bottom
map ctrl+l clear_screen

# Mouse settings
mouse_hide_wait 0.0
mouse_map left press paste_from_selection

# Bell
enable_audio_bell yes
bell_command paplay /usr/share/sounds/freedesktop/stereo/dialog-error.oga
