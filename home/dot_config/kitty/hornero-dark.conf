# Hornero Dark — Kitty palette (factory default).
#
# Derived from profiles/themes/hornero-dark/theme.json (flagship semantic
# tokens: ember terracotta #E07856, warm clay #D9A05F, sunset amber #F2B749
# on toasted-adobe night #1D1410). Hues outside the flagship ramp (dusty
# blue/rose/sage) are muted, background-adjacent companions — sophisticated,
# no neon rainbow. Gated by scripts/check-terminal-contrast.py:
# foreground + colors 1-6/9-14 hold WCAG AA against the background
# (normals >= 4.5:1, brights >= 3.0:1 bold/large-text floor) and
# red/green/yellow stay mutually distinguishable (CIE76 dE >= 10).

foreground #F6E9DB
background #1D1410

