# Hornero Light — Kitty palette (opt-in light variant).
#
# Derived from profiles/themes/hornero-light/theme.json (first-class light
# ramp, not an inverted dark: deep terracotta #B24827, fired clay #7C4A2C,
# sunset amber #96590A on warm morning paper #FAF1E3). Cool companions are
# dusty navy/plum/teal. Gated by scripts/check-terminal-contrast.py with
# the same two-tier rule as hornero-dark (normals >= 4.5:1, brights >=
# 3.0:1, red/green/yellow mutually distinguishable at CIE76 dE >= 10).
#
# To use: replace the `include hornero-dark.conf` line in kitty.conf with
# `include hornero-light.conf` (a future dots-appearance release may switch
# this automatically alongside the GTK day/night policy).

foreground #2B1A11
background #FAF1E3

# 16 ANSI colors
color0  #4E3423
color1  #B24827
color2  #3E6B2F
color3  #96590A
color4  #3E63A0
color5  #9C4A6E
color6  #2F7A72
color7  #F1E3CE
color8  #6E5140
color9  #C65D33
color10 #55813D
color11 #B07A1E
color12 #5278B8
color13 #B25E82
color14 #3F9187
color15 #2B1A11

# Cursor
cursor #B24827
cursor_text_color #FFFFFF

# Selection
selection_foreground #2B1A11
selection_background #F1E3CE

# URLs
url_color #7C4A2C

# Tabs
active_tab_foreground #FFFFFF
active_tab_background #B24827
inactive_tab_foreground #4E3423
inactive_tab_background #F1E3CE
