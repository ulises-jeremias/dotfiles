# Pampa — Kitty palette (opt-in pampa-night variant).
#
# Derived from profiles/themes/pampa/theme.json (pampa-night semantic
# tokens: leaf green #93B25E, olive #B3A24A, muted gold #D9A441 on
# grassland night #141B13). Hues outside the green ramp (clay red,
# dusty blue/rose/teal) are muted, background-adjacent companions —
# sophisticated, no neon rainbow, and no dark-blue-on-black: the blue
# axis is a readable dusty slate (#93A9BC, AA against the background).
# Gated by scripts/check-terminal-contrast.py:
# foreground + colors 1-6/9-14 hold WCAG AA against the background
# (normals >= 4.5:1, brights >= 3.0:1 bold/large-text floor) and
# red/green/yellow stay mutually distinguishable (CIE76 dE >= 10).
#
# To use: replace the `include hornero-dark.conf` line in kitty.conf with
# `include pampa.conf` (a future dots-appearance release may switch
# this automatically alongside the GTK day/night policy).

foreground #F4ECDA
background #141B13

# 16 ANSI colors
color0  #1D271C
color1  #DE8A7D
color2  #93B25E
color3  #CF9C3F
color4  #93A9BC
color5  #C08DA3
color6  #8FB3A2
color7  #D9CBA7
color8  #4C5C40
color9  #F0A297
color10 #B4D489
color11 #E5B85C
color12 #B3C8DA
color13 #D8A9BE
color14 #AECDC0
color15 #F4ECDA

# Cursor
cursor #D9A441
cursor_text_color #1A1408

# Selection
selection_foreground #F4ECDA
selection_background #2B3A28

# URLs
url_color #B3A24A

# Tabs
active_tab_foreground #141B0D
active_tab_background #93B25E
inactive_tab_foreground #D9CBA7
inactive_tab_background #1D271C
