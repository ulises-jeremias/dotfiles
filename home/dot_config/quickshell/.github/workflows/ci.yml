name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Qt6 + native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqalculate-dev libpipewire-0.3-dev libaubio-dev libfftw3-dev
      - name: Build + install libcava from source
        # No libcava package exists in Ubuntu archives; build the shared
        # library from the same fork Nix/AUR packages (pinned tag for
        # reproducibility) and expose it via a libcava.pc file so the
        # plugin's pkg-config lookup keeps working unchanged.
        run: |
          git clone --depth 1 --branch 1.0.0 \
            https://github.com/LukashonakV/cava /tmp/cava
          cc -shared -fPIC -O2 -I/tmp/cava -I/tmp/cava/include \
            -o /tmp/cava/libcava.so /tmp/cava/cavacore.c -lm -lfftw3
          sudo install -Dm755 /tmp/cava/libcava.so /usr/local/lib/libcava.so
          sudo install -Dm644 /tmp/cava/include/cava/cavacore.h \
            /tmp/cava/include/cava/common.h /tmp/cava/include/cava/config.h \
            -t /usr/local/include/cava/
          sudo install -Dm644 /tmp/cava/include/cava/input/common.h \
            -t /usr/local/include/cava/input/
          sudo install -Dm644 /tmp/cava/include/cava/output/common.h \
            -t /usr/local/include/cava/output/
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/libcava.pc > /dev/null <<'EOF'
          prefix=/usr/local
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: libcava
          Description: Shared library build of cava core (LukashonakV/cava)
          Version: 1.0.0
          Libs: -L${libdir} -lcava -lfftw3 -lm
          Cflags: -I${includedir}
          EOF
          sudo ldconfig
          pkg-config --modversion libcava
      - name: Configure
        run: cmake -S . -B build -D DISTRIBUTOR="ci"
      - name: Build
        run: cmake --build build

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: QML/import validation
        run: ./scripts/lint_qml.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest materialyoucolor==3.0.4
      - name: Test suite
        run: python3 -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh assets/wrap_term_launch.sh
      - name: markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: yaml lint
        run: pip install yamllint && yamllint .
      - name: personal-data guard
        run: ./scripts/check_personal_data.sh
      - name: forbidden-path scan
        run: ./scripts/check_forbidden_paths.sh
