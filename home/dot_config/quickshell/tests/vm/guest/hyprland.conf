# Minimal Hyprland config for harness test sessions only.
# This is not shipped to users and does not belong to HorneroOS/config:
# it gives the VM a deterministic single-output compositor while
# start-session.sh drives the shell under test over SSH.

monitor=Virtual-1,1280x720@60,0x0,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# The shell under test is started by start-session.sh over SSH so the
# harness controls ordering (compositor first, then the shell) and can
# capture per-stage logs. No exec-once launcher here on purpose.
