# Browser backing track virtual sink (Zen Browser -> REAPER in3/in4).
#
#   Zen Browser (select "Browser Backing" in pavucontrol / volume mixer)
#     -> browser_backing (Audio/Sink) -> browser_backing.output
#     -> qpwgraph patchbay -> REAPER:in3/in4 -> "Zen Browser (Backing)" track
#
# Never becomes the default sink (priority.session = 0) and its output never
# auto-connects, so audio only reaches REAPER and never doubles into speakers.
# Loaded when PipeWire starts. Rollback: delete this file and restart PipeWire.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Browser Backing (Zen -> REAPER)"
      capture.props = {
        node.name        = "browser_backing"
        node.description = "Browser Backing (Zen -> REAPER)"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        priority.session = 0
        priority.driver  = 0
      }
      playback.props = {
        node.name           = "browser_backing.output"
        node.description    = "Browser Backing output"
        node.autoconnect    = false
        node.dont-reconnect = true
        stream.dont-remix   = true
        audio.position      = [ FL FR ]
      }
    }
  }
]
