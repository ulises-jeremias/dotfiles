# Guitar lesson low-latency defaults (user-level, shipped with dots-guitar-lesson).
# Takes effect on next PipeWire start; `dots-guitar-lesson start` also forces the
# quantum at runtime so a restart is not required. Delete this file and run
# `systemctl --user restart pipewire wireplumber` to fully revert.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 44100 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 1024
}
