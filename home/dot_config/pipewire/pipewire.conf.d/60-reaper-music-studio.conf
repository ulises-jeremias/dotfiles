# REAPER music studio: permanent virtual audio endpoints (docs/REAPER-Vocal-Studio.md).
#
#   REAPER out 3-4 -> "REAPER Lesson Bus input" -> "REAPER Lesson Mic"  (Discord input)
#   REAPER out 5-6 -> "REAPER Program input"    -> "REAPER Program"     (OBS capture)
#   Discord output -> "Discord Call" (sink)     -> default output       (+ OBS capture)
#
# The REAPER links are made by the qpwgraph patchbay
# (~/.config/qpwgraph/music-studio.qpwgraph), not by these modules: the bus
# inputs never auto-connect, so nothing but REAPER can reach the lesson mic.
# These nodes do not change PipeWire's clock, quantum or default devices
# (priority.session = 0 keeps them from ever becoming the default).
# audio.position must sit on each side (capture and playback): set only on the
# module, the virtual source got no output ports and nothing could record it.
#
# Loaded when PipeWire starts. Rollback: delete this file, then
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "REAPER Lesson Mic"
      capture.props = {
        node.name          = "reaper_lesson.input"
        node.description   = "REAPER Lesson Bus input"
        node.autoconnect   = false
        node.dont-reconnect = true
        stream.dont-remix  = true
        audio.position     = [ FL FR ]
      }
      playback.props = {
        node.name        = "reaper_lesson_mic"
        node.description = "REAPER Lesson Mic"
        media.class      = "Audio/Source"
        audio.position   = [ FL FR ]
        priority.session = 0
        priority.driver  = 0
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "REAPER Program"
      capture.props = {
        node.name          = "reaper_program.input"
        node.description   = "REAPER Program input"
        node.autoconnect   = false
        node.dont-reconnect = true
        stream.dont-remix  = true
        audio.position     = [ FL FR ]
      }
      playback.props = {
        node.name        = "reaper_program"
        node.description = "REAPER Program"
        media.class      = "Audio/Source"
        audio.position   = [ FL FR ]
        priority.session = 0
        priority.driver  = 0
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Discord Call"
      capture.props = {
        node.name        = "discord_call"
        node.description = "Discord Call"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        priority.session = 0
        priority.driver  = 0
      }
      playback.props = {
        node.name        = "discord_call.output"
        node.description = "Discord Call to headphones"
        # follows the default output device (your headphones)
        audio.position   = [ FL FR ]
      }
    }
  }
]
