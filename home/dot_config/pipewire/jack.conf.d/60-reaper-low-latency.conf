# REAPER only: ask for a 256-frame period (5.3 ms at 48 kHz, 8 ms measured
# output latency) instead of PipeWire's default 1024. Read by the JACK client
# library when REAPER starts, so it applies however REAPER is launched and does
# not change PipeWire's defaults. While REAPER runs, the shared graph runs at
# this period for every client; when REAPER closes it returns to the default.
# If your hardware xruns, change 256 to 512. Rollback: delete this file.
jack.rules = [
  { matches = [ { application.process.binary = "reaper" } ]
    actions = { update-props = { node.latency = 256/48000 } }
  }
]
