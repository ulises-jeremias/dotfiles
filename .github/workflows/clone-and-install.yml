name: Clone and Install

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "31 1,12 * * *"

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clone-and-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        devcontainer-image:
          - mcr.microsoft.com/vscode/devcontainers/base:ubuntu
    container:
      image: ${{ matrix.devcontainer-image }}
      env:
        CODESPACES: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Lua for config contract tests
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends lua5.4

      - name: Validate Hornero source contract
        run: python3 tests/test_hornero_source_contract.py

      - name: Validate Hyprland Lua window-rule parity
        run: python3 tests/test_hyprland_lua_window_rules.py

      - name: Exercise staged Smart Colors Lua loader
        run: python3 tests/test_hyprland_lua_smart_colors_runtime.py

      - name: Smoke test chezmoi templates
        shell: bash
        run: |
          curl -fsLS get.chezmoi.io | sh -s -- -b "${HOME}/.local/bin"
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi init --source=.
          fail=0
          while IFS= read -r -d "" tmpl; do
            if ! chezmoi execute-template --source=. < "$tmpl" > /dev/null; then
              echo "::error::Template render failed: $tmpl"
              fail=1
            fi
          done < <(find home/.chezmoiscripts -name "*.tmpl" -print0)
          # Static-config flow: hand-maintained configs (e.g. a host
          # dotfiles.toml) may omit keys the managed init always sets
          # (.e2e bit us). Render every template against data WITHOUT
          # e2e so missing-key failures break CI, not a real apply.
          cat > /tmp/static-config.toml <<'EOF'
          [data]
              docker = false
              ephemeral = false
              headless = false
              hostname = "ci-static"
              osid = "linux-arch"
              personal = false
          EOF
          while IFS= read -r -d "" tmpl; do
            if ! chezmoi execute-template --config=/tmp/static-config.toml \
                --source=. < "$tmpl" > /dev/null; then
              echo "::error::Template render failed without e2e: $tmpl"
              fail=1
            fi
          done < <(find home/.chezmoiscripts -name "*.tmpl" -print0)
          exit $fail

      - name: Preserve Hornero terminal selection
        run: python3 tests/test_terminal_selection_ownership.py

      - name: Validate safe wallpaper migration
        run: python3 tests/test_wallpaper_migration.py

      - name: Validate guarded chezmoiremove cleanup
        run: python3 tests/test_kitty_native_migration.py

      - name: Verify source delivery mappings
        run: 'PATH="$HOME/.local/bin:$PATH" ./scripts/verify-delivery.sh'

      - name: Install Dotfiles
        run: ./install.sh

      - name: Chezmoi data
        if: always()
        run: '"$HOME/.local/bin/chezmoi" data'
